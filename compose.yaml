services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: applykit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/.env}
      POSTGRES_DB: applykit
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - applykit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applykit -d applykit"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  applykit-postgres:
