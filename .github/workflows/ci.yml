name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applykit
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: applykit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applykit -d applykit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://applykit:test-only-password@127.0.0.1:5432/applykit
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
